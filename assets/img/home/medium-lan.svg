<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="360" height="120">
 <title>Wtyk RJ-45 z przewodem Ethernet</title>
 <defs>
  <linearGradient id="plastik" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#eaf4fa" stop-opacity=".34"/>
   <stop offset=".55" stop-color="#b9cfdc" stop-opacity=".16"/>
   <stop offset="1" stop-color="#8fa9ba" stop-opacity=".22"/>
  </linearGradient>
  <linearGradient id="zloto" x1="0" y1="0" x2="1" y2="0">
   <stop offset="0" stop-color="#f4d985"/>
   <stop offset=".6" stop-color="#d3a640"/>
   <stop offset="1" stop-color="#b88a2c"/>
  </linearGradient>
  <linearGradient id="oslona" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#cf3b50"/>
   <stop offset=".35" stop-color="#b3233a"/>
   <stop offset="1" stop-color="#701425"/>
  </linearGradient>
  <linearGradient id="kolnierz" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#a81f34"/>
   <stop offset="1" stop-color="#5e1020"/>
  </linearGradient>
  <clipPath id="obrys"><rect x="188" y="31" width="108" height="58" rx="4"/></clipPath>
 </defs>
 <!-- cień pod elementami (światło z lewej-góry) -->
 <ellipse cx="190" cy="104" rx="150" ry="5" fill="#000" opacity=".35"/>
 <!-- przewód -->
 <rect x="0" y="46" width="146" height="28" fill="url(#oslona)"/>
 <path d="M0 47.5H146" stroke="#e8707f" stroke-width="1.2" opacity=".7"/>
 <path d="M30 46v28M86 46v28" stroke="#7a1526" stroke-width=".8" opacity=".45"/>
 <!-- osłona zagięcia (boot) -->
 <path d="M118 46.5c14 0 22-8.500 38-8.500h36v44h-36c-16 0-24-8.500-38-8.500z" fill="url(#kolnierz)"/>
 <path d="M121 47c14 0 22-8 37-8h32" fill="none" stroke="#dd5a6c" stroke-width="1.2" opacity=".75"/>
 <path d="M162 39v42M171 39v42M180 39v42" stroke="#4d0c19" stroke-width="1.400" opacity=".7"/>
 <!-- cień obudowy -->
 <rect x="191.500" y="34" width="108" height="58" rx="4" fill="#05080c" opacity=".55"/>
 <!-- przewody wewnątrz przezroczystego wtyku -->
 <g clip-path="url(#obrys)">
  <rect x="186" y="46" width="30" height="28" fill="url(#oslona)"/>
  <g fill="none" stroke-width="4.600" stroke-linecap="butt">
   <path d="M216 49.500 232 37.500H254" stroke="#f1efe8"/><path d="M216 49.500 232 37.500H254" stroke="#ee8a2b" stroke-dasharray="3 3"/>
   <path d="M216 52.500 232 44H254" stroke="#ee8a2b"/>
   <path d="M216 55.500 232 50.500H254" stroke="#f1efe8"/><path d="M216 55.500 232 50.500H254" stroke="#3f9d4b" stroke-dasharray="3 3"/>
   <path d="M216 58.500 232 57H254" stroke="#2f6fd0"/>
   <path d="M216 61.500 232 63.500H254" stroke="#f1efe8"/><path d="M216 61.500 232 63.500H254" stroke="#2f6fd0" stroke-dasharray="3 3"/>
   <path d="M216 64.500 232 70H254" stroke="#3f9d4b"/>
   <path d="M216 67.500 232 76.500H254" stroke="#f1efe8"/><path d="M216 67.500 232 76.500H254" stroke="#8a5a34" stroke-dasharray="3 3"/>
   <path d="M216 70.500 232 83H254" stroke="#8a5a34"/>
  </g>
  <!-- osiem styków -->
  <g fill="url(#zloto)" stroke="#8a6a1f" stroke-width=".4">
   <rect x="252" y="35.200" width="42" height="4.600"/><rect x="252" y="41.700" width="42" height="4.600"/>
   <rect x="252" y="48.200" width="42" height="4.600"/><rect x="252" y="54.700" width="42" height="4.600"/>
   <rect x="252" y="61.200" width="42" height="4.600"/><rect x="252" y="67.700" width="42" height="4.600"/>
   <rect x="252" y="74.200" width="42" height="4.600"/><rect x="252" y="80.700" width="42" height="4.600"/>
  </g>
  <g fill="#6b4e12" opacity=".75">
   <rect x="259" y="35.200" width="1.400" height="4.600"/><rect x="259" y="41.700" width="1.400" height="4.600"/>
   <rect x="259" y="48.200" width="1.400" height="4.600"/><rect x="259" y="54.700" width="1.400" height="4.600"/>
   <rect x="259" y="61.200" width="1.400" height="4.600"/><rect x="259" y="67.700" width="1.400" height="4.600"/>
   <rect x="259" y="74.200" width="1.400" height="4.600"/><rect x="259" y="80.700" width="1.400" height="4.600"/>
  </g>
  <!-- zatrzask widoczny przez tworzywo -->
  <path d="M206 89l9-9h69l9 9z" fill="#dbe9f1" opacity=".22" stroke="#cfe0ea" stroke-width=".7" stroke-opacity=".6"/>
  <path d="M284 80v-6" stroke="#cfe0ea" stroke-width=".7" opacity=".6"/>
 </g>
 <!-- korpus z przezroczystego tworzywa -->
 <rect x="188" y="31" width="108" height="58" rx="4" fill="url(#plastik)" stroke="#a9c0ce" stroke-width="1.300"/>
 <path d="M192 34.500H292" stroke="#fff" stroke-width="1.200" opacity=".55"/>
 <path d="M190.500 36v50" stroke="#fff" stroke-width="1" opacity=".35"/>
 <path d="M240 31v58" stroke="#d9e8f0" stroke-width=".8" opacity=".35"/>
 <!-- wycięcia ramion zatrzasku przy czole -->
 <path d="M296 31v8h-5v-8M296 89v-8h-5v8" fill="#0d1218" stroke="#a9c0ce" stroke-width="1"/>
</svg>
