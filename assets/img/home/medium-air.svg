<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="360" height="120">
 <title>Radiolinia: antena sektorowa i zewnętrzne CPE</title>
 <defs>
  <linearGradient id="obudowa" x1="0" y1="0" x2="1" y2="0">
   <stop offset="0" stop-color="#f4f6f8"/>
   <stop offset=".6" stop-color="#d4dae0"/>
   <stop offset="1" stop-color="#a3adb7"/>
  </linearGradient>
  <linearGradient id="obudowa-pion" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#f7f9fb"/>
   <stop offset="1" stop-color="#b3bcc5"/>
  </linearGradient>
  <linearGradient id="maszt" x1="0" y1="0" x2="1" y2="0">
   <stop offset="0" stop-color="#8d98a3"/>
   <stop offset=".4" stop-color="#6b7580"/>
   <stop offset="1" stop-color="#454d57"/>
  </linearGradient>
 </defs>
 <ellipse cx="180" cy="110" rx="165" ry="4" fill="#000" opacity=".35"/>
 <!-- fale radiowe: czoła fal w wiązce kierunkowej -->
