 <path d="M66 102c0 6-4 8-8 8" fill="none" stroke="#2c333b" stroke-width="2" stroke-linecap="round"/>
 <!-- prawy punkt: zewnętrzne CPE (anteny talerzowej z radiem) -->
 <rect x="326" y="48" width="5" height="62" fill="url(#maszt)"/>
 <rect x="318" y="94" width="21" height="4" rx="1" fill="#59626c"/>
