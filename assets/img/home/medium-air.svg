  <path d="M104 40q-14 20 0 40" stroke-width="1.300" opacity=".85"/>
  <path d="M128 31q-22 29 0 58" stroke-width="1.300" opacity=".65"/>
  <path d="M152 24q-30 36 0 72" stroke-width="1.200" opacity=".48"/>
  <path d="M176 18q-38 42 0 84" stroke-width="1.100" opacity=".34"/>
  <path d="M100 60h150" stroke-width="1" stroke-dasharray="1.500 6" opacity=".55"/>
  <path d="M104 34 250 52M104 86 250 68" stroke-width=".7" opacity=".22"/>
 </g>
 <!-- lewy punkt: antena sektorowa na maszcie -->
