name: MAD-NET / jakość
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testy projektu
        run: npm test
      - name: Budowanie strony
        run: npm run build
      - name: Sprawdzenie artefaktów
        run: test -s dist/index.html && test -s dist/assets/js/hero-rack.js
