name: MAD-NET / jakość
permissions:
  contents: read
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Zależności testowe
        run: npm ci
      - name: Testy projektu
        run: npm test
      - name: Budowanie strony
        run: npm run build
      - name: Sprawdzenie artefaktów
        run: test -s dist/index.html && test -s dist/cennik.html && test -s dist/assets/js/home.js && test -s dist/assets/js/hero-rack.js
      - name: Chromium do testów V20
        run: npx playwright-core install --with-deps chromium
      - name: Diagnostyka sieci ofert — trzy próby
        env:
          MADNET_DEBUG_NETWORK: '1'
        run: |
          mkdir -p test-results/finalizacja
          wynik=0
          for proba in 1 2 3; do
            kod=0
            node tests/oferta.browser.mjs > "test-results/finalizacja/oferta-linux-${proba}.log" 2>&1 || kod=$?
            cp test-results/finalizacja/oferta-network.json "test-results/finalizacja/oferta-linux-${proba}.json"
            cat "test-results/finalizacja/oferta-linux-${proba}.log"
            echo "Próba ${proba}: exit=${kod} HEAD=$(git rev-parse HEAD)"
            if [ "$kod" -ne 0 ]; then wynik=1; fi
          done
          exit "$wynik"
      - name: Regresja geometrii i interakcji V20
        run: npm run test:browser
      - name: Regresja PCB
        run: npm run test:pcb
      - name: Regresja dziewięciu stron
        run: npm run test:integracja
      - name: Artefakt witryny po pełnej walidacji
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Zrzuty i pomiary V20
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mad-net-v20-przegladarka
          path: |
            test-results/finalizacja
            test-results/integracja
            test-results/fiber
            test-results/pcb-4-1
            test-results/v20/po
            test-results/panel
            test-results/integracja-home-v3/04
            test-results/v21
            test-results/integracja-home-v3/02
            test-results/integracja-home-v3/03
  publikacja:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.wdrozenie.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Publikacja wyłącznie zweryfikowanego dist
        id: wdrozenie
        uses: actions/deploy-pages@v4
